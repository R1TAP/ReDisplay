<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self'">
    <title>ReDisplay</title>
    <link rel="stylesheet" href="styles.css">
    <script src="../i18n.js" defer></script>
    <script src="renderer.js" defer></script>
</head>
<body>
    <header class="titlebar">
        <div class="brand">
            <img src="../assets/icon.png" width="22" height="22" alt="">
            <span>ReDisplay</span>
            <span class="version-tag">v1.1.0</span>
        </div>
        <div class="window-controls">
            <button id="btn-tray-min" class="icon-button" data-label="隐藏至托盘">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7ZM5 18v2h14v-2Z"/></svg>
            </button>
            <button id="btn-minimize" class="icon-button" data-label="最小化">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v2H5Z"/></svg>
            </button>
            <button id="btn-maximize" class="icon-button" data-label="最大化或还原">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4Zm2 2v12h12V6Z"/></svg>
            </button>
            <button id="btn-close" class="icon-button close-button" data-label="关闭窗口并保留托盘">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4-6.3-6.3-6.3 6.3-1.4-1.4 6.3-6.3-6.3-6.3 1.4-1.4 6.3 6.3 6.3-6.3Z"/></svg>
            </button>
        </div>
    </header>

    <div class="app-shell">
        <aside class="sidebar">
            <nav class="page-navigation" data-label="控制中心">
                <button data-page="connect" aria-current="page" aria-controls="page-connect" data-label="连接">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v12h-8v3h4v1H7v-1h4v-3H3Zm2 2v8h14V6Z"/></svg>
                    <span data-t="连接">连接</span>
                </button>
                <button data-page="picture" aria-controls="page-picture" data-label="画面">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4Zm0 10h16v2H4Z"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg>
                    <span data-t="画面">画面</span>
                </button>
                <button data-page="diagnostics" aria-controls="page-diagnostics" data-label="诊断">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19h18v2H3Zm2-7h3v5H5Zm6-8h3v13h-3Zm6 5h3v8h-3Z"/></svg>
                    <span data-t="诊断">诊断</span>
                </button>
                <button data-page="settings" aria-controls="page-settings" data-label="设置">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M9.5 2h5l.7 2.5 2 .9 2.3-1.1 3.5 3.5-1.1 2.3.9 2 .2.1v4l-2.5.7-.9 2 1.1 2.3-2 2-2.3-1.1-2 .9-.7 1H9.5l-.7-2.5-2-.9-2.3 1.1L1 18.2l1.1-2.3-.9-2L1 13.8v-4l2.5-.7.9-2-1.1-2.3 2-2 2.3 1.1 2-.9ZM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>
                    <span data-t="设置">设置</span>
                </button>
            </nav>
        </aside>

        <main>
            <div class="workspace">
                <header class="overview">
                    <div>
                        <h1 id="page-title">连接</h1>
                        <p id="page-description">选择接收设备和采集显示器。</p>
                    </div>
                    <div class="stream-controls">
                        <div id="status-pill" class="status-badge status-idle" role="status">
                            <span class="badge-dot" aria-hidden="true"></span><span id="status-text">待机就绪</span>
                        </div>
                        <button id="btn-toggle-stream" class="filled-button">
                            <svg id="icon-stream" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z"/></svg>
                            <span id="text-stream">启动串流</span>
                        </button>
                    </div>
                </header>

                <section id="reconfig-confirm-banner" class="reconfig-banner" aria-labelledby="reconfig-title" hidden>
                    <div>
                        <h2 id="reconfig-title" data-t="保留新设置？">保留新设置？</h2>
                        <p id="reconfig-desc"></p>
                    </div>
                    <div class="banner-actions">
                        <button id="btn-reconfig-revert" class="text-button"><span id="reconfig-countdown">10</span></button>
                        <button id="btn-reconfig-keep" class="filled-button small" data-t="保留设置">保留设置</button>
                    </div>
                </section>

                <section id="page-connect" class="page" aria-labelledby="page-title">
                    <div class="field-columns">
                        <div class="form-field">
                            <div class="field-heading">
                                <label for="select-device" data-t="Android 设备">Android 设备</label>
                                <button id="btn-refresh-devices" class="text-button" data-label="刷新 Android 设备" data-t="刷新">刷新</button>
                            </div>
                            <select id="select-device"><option value="" data-t="正在查找设备…">正在查找设备…</option></select>
                            <p id="device-hint" class="field-hint"></p>
                        </div>
                        <div class="form-field">
                            <div class="field-heading">
                                <label for="select-display" data-t="采集显示器">采集显示器</label>
                                <button id="btn-refresh-displays" class="text-button" data-label="刷新显示器" data-t="刷新">刷新</button>
                            </div>
                            <select id="select-display"><option value="" data-t="自动选择 · 优先虚拟显示器">自动选择 · 优先虚拟显示器</option></select>
                            <p id="val-display" class="field-hint"></p>
                        </div>
                    </div>
                    <section class="page-section">
                        <h2 data-t="连接检查">连接检查</h2>
                        <div class="check-row">
                            <span data-t="Android 应用">Android 应用</span>
                            <span class="check-result"><span id="dot-apk" class="health-dot" aria-hidden="true"></span><span id="val-apk"></span></span>
                            <button id="btn-status-apk" class="text-button" hidden data-t="安装">安装</button>
                        </div>
                        <div class="check-row">
                            <span data-t="虚拟显示驱动">虚拟显示驱动</span>
                            <span class="check-result"><span id="dot-driver" class="health-dot" aria-hidden="true"></span><span id="val-driver" data-t="检查中…">检查中…</span></span>
                            <button id="btn-status-driver" class="text-button" hidden data-t="安装">安装</button>
                        </div>
                        <div class="check-row">
                            <span data-t="USB 链路">USB 链路</span>
                            <span id="stat-usb-desc" class="check-result" role="status"></span>
                            <button id="btn-open-usb" class="text-button" disabled data-t="测速">测速</button>
                        </div>
                        <button id="btn-win-display" class="text-button section-link" data-t="Windows 显示设置">Windows 显示设置</button>
                    </section>
                </section>

                <section id="page-picture" class="page" aria-labelledby="page-title" hidden>
                    <div class="field-columns">
                        <div class="form-field">
                            <label data-t="串流预设">串流预设</label>
                            <div id="seg-profile" class="segmented" role="group" data-label="串流预设">
                                <button data-profile="esports" aria-pressed="true" data-t="高帧率">高帧率</button>
                                <button data-profile="quality" aria-pressed="false" data-t="高画质">高画质</button>
                                <button data-profile="office" aria-pressed="false" data-t="低码率">低码率</button>
                                <button data-profile="custom" aria-pressed="false" data-t="自定义">自定义</button>
                            </div>
                        </div>
                        <div class="form-field">
                            <div class="field-heading">
                                <label for="select-resolution" data-t="副屏分辨率">副屏分辨率</label>
                                <span id="val-resolution-ratio" class="field-hint"></span>
                            </div>
                            <select id="select-resolution">
                                <option value="1752x2800">1752 × 2800</option><option value="2800x1752">2800 × 1752</option>
                                <option value="1600x2560">1600 × 2560</option><option value="2560x1600">2560 × 1600</option>
                                <option value="1200x1920">1200 × 1920</option><option value="1920x1200">1920 × 1200</option>
                                <option value="1080x1920">1080 × 1920</option><option value="1920x1080">1920 × 1080</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-field page-section">
                        <div class="field-heading">
                            <label for="slider-fps" data-t="串流帧率">串流帧率</label>
                            <output id="val-fps" class="range-value" for="slider-fps">180 FPS</output>
                        </div>
                        <input id="slider-fps" type="range" min="0" max="4" step="1" value="4" aria-describedby="fps-hint">
                        <div id="fps-ticks" class="range-scale" aria-hidden="true"></div>
                        <p id="fps-hint" class="field-hint"></p>
                    </div>
                    <div class="form-field page-section">
                        <div class="field-heading">
                            <label for="slider-bitrate" data-t="编码码率">编码码率</label>
                            <output id="val-bitrate" class="range-value" for="slider-bitrate">60 Mbps</output>
                        </div>
                        <input id="slider-bitrate" type="range" min="20" max="100" step="5" value="60" aria-valuetext="60 Mbps">
                        <div class="chip-row" role="group" data-label="快捷码率">
                            <button class="chip" data-val="30" aria-pressed="false">30</button>
                            <button class="chip" data-val="60" aria-pressed="true">60</button>
                            <button class="chip" data-val="85" aria-pressed="false">85</button>
                            <button class="chip" data-val="100" aria-pressed="false">100</button>
                        </div>
                    </div>
                </section>

                <section id="page-diagnostics" class="page" aria-labelledby="page-title" hidden>
                    <section>
                        <div class="field-heading">
                            <h2 data-t="运行状态">运行状态</h2>
                            <p id="stream-mode" class="field-hint"></p>
                        </div>
                        <div class="metrics">
                            <div class="metric">
                                <div class="metric-label"><span data-t="发送帧率">发送帧率</span><span id="card-fps-target" class="metric-tag" hidden></span></div>
                                <div class="metric-value"><span id="stat-fps">—</span><small>FPS</small></div>
                                <div id="stat-fps-desc" class="metric-note"></div>
                            </div>
                            <div class="metric">
                                <div class="metric-label" data-t="发送码率">发送码率</div>
                                <div class="metric-value"><span id="stat-bitrate">—</span><small>Mbps</small></div>
                                <div class="metric-note">ADB / TCP</div>
                            </div>
                            <div class="metric">
                                <div class="metric-label" data-t="编码耗时">编码耗时</div>
                                <div class="metric-value"><span id="stat-latency">—</span><small>ms</small></div>
                                <div id="stat-encode-tail" class="metric-note">P95 —</div>
                            </div>
                            <div class="metric">
                                <div class="metric-label" data-t="已发送帧数">已发送帧数</div>
                                <div class="metric-value"><span id="stat-frames">—</span><small data-t="帧">帧</small></div>
                                <div id="badge-drop-rate" class="metric-note"></div>
                            </div>
                        </div>
                        <div class="cadence">
                            <span><span data-t="编码帧间隔 P95">编码帧间隔 P95</span> <strong id="stat-frame-gap">—</strong></span>
                            <span id="stat-gpu-desc">NVENC H.264</span>
                        </div>
                    </section>
                    <section class="page-section">
                        <div class="field-heading">
                            <div>
                                <h2 data-t="USB 连接测速">USB 连接测速</h2>
                                <p class="field-hint" data-t="通过 ADB 传输 10 MiB 数据测量实际吞吐。">通过 ADB 传输 10 MiB 数据测量实际吞吐。</p>
                            </div>
                            <button id="btn-test-usb" class="filled-button small" disabled></button>
                        </div>
                        <div class="usb-result" role="status">
                            <div class="usb-speed"><strong id="usb-speed">—</strong><span>MB/s</span></div>
                            <div class="usb-result-details">
                                <span id="usb-estimate" class="metric-tag" hidden></span>
                                <span id="usb-test-state"></span>
                                <span id="usb-negotiated"></span>
                            </div>
                        </div>
                    </section>
                    <details id="log-drawer" class="page-section">
                        <summary id="btn-toggle-log" data-t="运行日志">运行日志</summary>
                        <div class="log-actions"><button id="btn-clear-log" class="text-button" data-t="清空日志">清空日志</button></div>
                        <div id="log-console" class="log-console" tabindex="0" data-label="串流运行日志"></div>
                    </details>
                </section>

                <section id="page-settings" class="page" aria-labelledby="page-title" hidden>
                    <div class="field-columns">
                        <div class="form-field">
                            <label for="select-theme" data-t="外观">外观</label>
                            <select id="select-theme">
                                <option value="system" data-t="跟随系统">跟随系统</option>
                                <option value="light" data-t="浅色模式">浅色模式</option>
                                <option value="dark" data-t="深色模式">深色模式</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="select-language" data-t="界面语言">界面语言</label>
                            <select id="select-language"><option value="zh-CN">简体中文</option><option value="en">English</option></select>
                        </div>
                    </div>
                    <div class="form-field">
                        <h2 data-t="主题配色">主题配色</h2>
                        <div class="swatches" role="group" data-label="主题配色">
                            <button class="swatch" data-palette="lavender" data-label="薰衣草紫" aria-pressed="true"></button>
                            <button class="swatch" data-palette="rose" data-label="玫瑰粉" aria-pressed="false"></button>
                            <button class="swatch" data-palette="blue" data-label="湖蓝" aria-pressed="false"></button>
                            <button class="swatch" data-palette="mint" data-label="薄荷绿" aria-pressed="false"></button>
                            <button class="swatch" data-palette="amber" data-label="琥珀" aria-pressed="false"></button>
                        </div>
                        <p id="palette-name" class="field-hint"></p>
                    </div>
                    <section class="page-section">
                        <h2 data-t="高级设置">高级设置</h2>
                        <div class="form-field advanced-field">
                            <span class="field-label" id="buffer-label" data-t="发送队列">发送队列</span>
                            <div id="seg-buffermode" class="segmented" role="group" aria-labelledby="buffer-label">
                                <button data-mode="lowlatency" aria-pressed="true" data-t="低延迟 · 2 帧">低延迟 · 2 帧</button>
                                <button data-mode="smooth" aria-pressed="false" data-t="平滑优先 · 12 帧">平滑优先 · 12 帧</button>
                            </div>
                        </div>
                        <label class="switch-row" for="switch-autoreconnect">
                            <span><span data-t="自动重连">自动重连</span><small data-t="中断后等待同一设备恢复连接">中断后等待同一设备恢复连接</small></span>
                            <input id="switch-autoreconnect" type="checkbox" role="switch" checked>
                        </label>
                    </section>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
