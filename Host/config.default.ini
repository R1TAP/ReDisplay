[Device]
; Android ADB serial or "auto" to prefer a connected tablet.
serial=auto
; Local ADB forwarding port. 0 lets ADB allocate a free port.
port=0

[Display]
; -1 selects a virtual display automatically.
display_index=-1
width=1752
height=2800
; 0 uses the current Windows display refresh rate.
fps=180

[Encoder]
bitrate_mbps=60
