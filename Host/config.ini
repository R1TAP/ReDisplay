[Device]
# Serial number of device, or "auto" to automatically pick Samsung Tab S9+
serial=auto
# ADB tunnel port
port=27183

[Display]
# Monitor index to capture, or -1 for auto (selects Virtual Display or 2800x1752 display)
display_index=4
# Target resolution (Samsung Galaxy Tab S9+ native: 2800x1752)
width=1752
height=2800
# Refresh rate (Tab S9+ AMOLED supports 120Hz and 60Hz)
fps=120

[Encoder]
# Encoder type: nvenc (RTX 4070 hardware encoder)
encoder=nvenc
# Target bitrate in Mbps (Recommended 50-80 Mbps on 10Gbps USB)
bitrate_mbps=60
# Low latency preset (p1 = lowest latency, p2 = low latency quality)
preset=p1
# Tune mode: ull (Ultra Low Latency)
tune=ull
